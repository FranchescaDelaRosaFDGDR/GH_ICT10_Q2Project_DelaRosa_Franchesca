
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <title>Q2 Project</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #303439;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        nav {
            background-color: #222831;
            padding: 12px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            margin: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 6px;
            transition: 0.3s;
        }
        nav a:hover {
            background-color: #454c56;
        }
        nav img {
            height: 50px;
            width: auto;
            display: block;
        }
        .container {
            background-color: white;
            color: #222831;
            max-width: 700px;
            width: 90%;
            margin: 60px auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        h1 {
            margin-bottom: 30px;
        }
        h3 {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            margin: 8px;
            font-size: 16px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        input[type="button"] {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            background-color: #222831;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        input[type="button"]:hover {
            background-color: #454c56;
        }
        #output {
            background-color: #f1f2f4;
            color: #222831;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
            min-height: 50px;
            overflow-wrap: anywhere;
        }
        footer {
            background-color: #222831;
            color: white;
            text-align: center;
            padding: 20px;
            width: 100%;
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin-top: 150px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">
            <img src="gossiping.png" alt="Logo">
        </a>
        <a href="index.html">Club Member Checker</a>
        <a href="elementchecker.html">Element Checker</a>
        <a href="clubmembers.html">School Club Members</a>
        <a href="meetcreator.html">Meet the Creator</a>
    </nav>
    <div class="container">
        <h1>Gossip Club Members</h1>
        <h3>Add New Club Member:</h3>
        <input type="text" id="first_name"
            placeholder="Enter your first name">
        <input type="text" id="last_name"
            placeholder="Enter your last name">
        <br>
        <input type="button" py-click="new_member"
            value="Submit">
        <div id="output"></div>
    </div>
    <py-script src="main.py"></py-script>
    <footer>
        Franchesca Dela Rosa | 10 - Topaz | © 2026
    </footer>
</body>
</html>
